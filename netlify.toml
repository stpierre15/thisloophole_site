[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/check-purchase"
  to = "/.netlify/functions/check-purchase"
  status = 200
  force = true

[[redirects]]
  from = "/api/outcome"
  to = "/.netlify/functions/outcome"
  status = 200
  force = true

[[redirects]]
  from = "/api/metrics"
  to = "/.netlify/functions/metrics"
  status = 200
  force = true

# Previous chat clients receive an explicit retirement response.
[[redirects]]
  from = "/api/loophole"
  to = "/.netlify/functions/anthropic-proxy"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."dealership-image"]
  included_files = ["server-assets/dealership/revealed/**"]

[[redirects]]
  from = "/api/dealership-start"
  to = "/.netlify/functions/dealership-start"
  status = 200
  force = true

[[redirects]]
  from = "/api/dealership-session"
  to = "/.netlify/functions/dealership-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/dealership-lock"
  to = "/.netlify/functions/dealership-lock"
  status = 200
  force = true

[[redirects]]
  from = "/api/dealership-decision"
  to = "/.netlify/functions/dealership-decision"
  status = 200
  force = true

[[redirects]]
  from = "/api/dealership-image"
  to = "/.netlify/functions/dealership-image"
  status = 200
  force = true

[[redirects]]
  from = "/dealership/results/*"
  to = "/dealership/results/index.html"
  status = 200

[[redirects]]
  from = "/dealership/reveal/*"
  to = "/dealership/reveal/index.html"
  status = 200

[[redirects]]
  from = "/api/vehicle-search"
  to = "/.netlify/functions/vehicle-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/vehicle-detail"
  to = "/.netlify/functions/vehicle-detail"
  status = 200
  force = true

[[redirects]]
  from = "/api/vin-decode"
  to = "/.netlify/functions/vin-decode"
  status = 200
  force = true

[[redirects]]
  from = "/api/deal-plan-checkout"
  to = "/.netlify/functions/deal-plan-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/deal-plan"
  to = "/.netlify/functions/deal-plan"
  status = 200
  force = true

[[redirects]]
  from = "/car/*"
  to = "/car/index.html"
  status = 200

[[redirects]]
  from = "/deal-plan/*"
  to = "/deal-plan/index.html"
  status = 200

[[redirects]]
  from = "/tools"
  to = "/"
  status = 301

[[redirects]]
  from = "/tools.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/api/inspect-product"
  to = "/.netlify/functions/inspect-product"
  status = 200
  force = true

[[redirects]]
  from = "/api/same-thing"
  to = "/.netlify/functions/same-thing"
  status = 200
  force = true

[[redirects]]
  from = "/api/email-capture"
  to = "/.netlify/functions/email-capture"
  status = 200
  force = true

[[redirects]]
  from = "/api/studio-event"
  to = "/.netlify/functions/studio-event"
  status = 200
  force = true

[[redirects]]
  from = "/samething/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/samething"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/purchase-checker"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/purchase-checker/*"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/samething/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ebayimg.com https://*.ebayimg.com https://m.media-amazon.com data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/api/circular-search"
